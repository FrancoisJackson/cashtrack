<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CashTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CashTrack">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one column, month header + total on top, day-grouped list, thumb-reach add button fixed at the bottom */
:root {
  --bg: #f3f4f8; --card: #ffffff; --fg: #161a2b; --muted: #6a7088; --line: #e1e4ee;
  --accent: #2f4bd8; --accent-fg: #ffffff; --danger: #c73a3a; --warn: #c27a12;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1220; --card: #181c2e; --fg: #eceefa; --muted: #959bb5; --line: #272c44;
  --accent: #7d8fff; --accent-fg: #0f1220; --danger: #ff7a7a; --warn: #f0a742; color-scheme: dark } }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(120px + env(safe-area-inset-bottom)); display: grid; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.month { display: flex; align-items: center; justify-content: space-between; }
.month h1 { margin: 0; font: 600 1.05rem var(--display); text-transform: capitalize; }
.nav { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; font-size: 1.3rem; }
.nav:disabled { opacity: .35; cursor: default; }

.total { display: grid; gap: 4px; }
.total .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.total .big { font: 800 clamp(2.6rem, 13vw, 3.6rem)/1 var(--display); letter-spacing: -.02em; }
.total .sub { color: var(--muted); font-size: .9rem; }

.budget-set { width: 100%; min-height: 48px; border: 1px dashed var(--line); border-radius: 14px; background: none; color: var(--accent); font-weight: 600; }
.budget-box { width: 100%; display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); text-align: left; --state: var(--accent); }
.budget-box[data-state="near"] { --state: var(--warn); }
.budget-box[data-state="over"] { --state: var(--danger); }
.budget-bar { display: block; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.budget-bar i { display: block; height: 100%; border-radius: 5px; background: var(--state); }
.budget-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .92rem; }
.budget-line b { color: var(--state); font-weight: 600; }
.budget-line span { color: var(--muted); }
.budget-form { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.budget-input { display: flex; align-items: center; gap: 8px; }
.budget-input b { font: 600 1.2rem var(--display); color: var(--muted); }
.budget-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.budget-actions .remove { color: var(--fg); }
.cats { display: grid; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 7.5rem 1fr auto; align-items: center; gap: 10px; font-size: .9rem; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }

h2 { margin: 0 0 8px; font: 600 .8rem var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.days { display: grid; gap: 12px; }
.day { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.day-head { display: flex; justify-content: space-between; padding: 10px 14px 6px; font-size: .82rem; color: var(--muted); text-transform: capitalize; }
.item { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.item .dot { width: 10px; height: 10px; border-radius: 50%; }
.item .what { min-width: 0; }
.item .what b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .what small { color: var(--muted); }
.item .amt { font-weight: 600; }

.history { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 130px; }
.history button { display: grid; grid-template-rows: 1fr auto auto; height: 100%; gap: 4px; border: 0; background: none; padding: 0; font-size: .72rem; color: var(--muted); }
.history .col { align-self: end; border-radius: 6px 6px 2px 2px; background: var(--line); min-height: 3px; }
.history button[aria-current="true"] .col { background: var(--accent); }
.history button[aria-current="true"] { color: var(--fg); font-weight: 600; }
.history button.over .col { background: var(--danger); }

.empty, .note { margin: 0; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; text-align: center; }
.foot { text-align: center; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: .85rem; padding: 8px; }

.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); height: 60px; padding: 0 28px; border: 0; border-radius: 30px; background: var(--accent); color: var(--accent-fg); font: 600 1.05rem var(--body); box-shadow: 0 8px 24px rgb(20 30 90 / .3); display: flex; align-items: center; gap: 10px; }
.fab span { font-size: 1.6rem; line-height: 1; }

/* add / edit expense: a full-screen page, so nothing overflows and the iOS keyboard never hides the fields */
.sheet { position: fixed; inset: 0; z-index: 21; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.sheet form, .login form { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 48px; }
.sheet-head h2 { margin: 0; color: var(--fg); font: 600 1rem var(--display); text-transform: none; letter-spacing: 0; }
.sheet-head button { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 12px 0; }
.lbl { display: grid; gap: 8px; min-width: 0; }
.lbl > span { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.amount-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; min-width: 0; }
.amount-field input { flex: 1; width: 100%; min-width: 0; border: 0; background: none; color: var(--fg); font: 800 2.6rem var(--display); outline: none; padding: 0; }
.amount-field span { font: 600 1.6rem var(--display); color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chip { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: .95rem; display: flex; align-items: center; gap: 8px; text-align: left; min-width: 0; }
.chip i { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--card); }
.field { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 50px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; }
input[type="date"].field { text-align: left; }
input[type="date"].field::-webkit-date-and-time-value { text-align: left; }
.submit { padding: 16px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font: 600 1.05rem var(--body); }
.remove { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: none; color: var(--danger); font-weight: 600; }
.remove.armed { background: var(--danger); border-color: var(--danger); color: var(--card); }
body.locked { overflow: hidden; }
.submit:disabled { opacity: .5; }
.err { color: var(--danger); font-size: .9rem; margin: 0; }
.ok { color: var(--muted); font-size: .9rem; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 30; }

.login { min-height: 100vh; display: grid; align-content: center; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-block: 24px; }
.login h1 { margin: 0; font: 800 2.4rem/1 var(--display); letter-spacing: -.02em; }
.login p { margin: 0; color: var(--muted); }
.login .alt { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .6 } }
}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm" novalidate>
    <h1>CashTrack</h1>
    <p id="loginIntro">Connecte-toi pour retrouver tes dépenses.</p>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="E-mail" required>
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Mot de passe (6 caractères min.)" required minlength="6">
    <p class="err" id="loginErr" hidden></p>
    <p class="ok" id="loginOk" hidden></p>
    <button class="submit" id="loginBtn">Se connecter</button>
    <button type="button" class="alt" id="toggleMode">Première fois ? Créer mon compte</button>
  </form>
</section>

<main id="app" hidden>
  <div class="wrap">
    <header class="month">
      <button class="nav" id="prev" aria-label="Mois précédent">‹</button>
      <h1 id="monthName">…</h1>
      <button class="nav" id="next" aria-label="Mois suivant">›</button>
    </header>

    <section class="total">
      <span class="label">Dépensé ce mois</span>
      <span class="big num" id="total">0,00 €</span>
      <span class="sub" id="sub"></span>
    </section>

    <section class="budget">
      <button class="budget-set" id="budgetSet" hidden>+ Définir un budget mensuel</button>
      <button class="budget-box" id="budgetBox" hidden aria-label="Modifier le budget mensuel">
        <span class="budget-bar"><i id="budgetFill"></i></span>
        <span class="budget-line"><b class="num" id="budgetLeft"></b><span class="num" id="budgetOf"></span></span>
      </button>
      <form class="budget-form" id="budgetForm" hidden novalidate>
        <label class="lbl"><span>Budget par mois</span>
          <span class="budget-input"><input class="field" id="budgetInput" inputmode="decimal" autocomplete="off" placeholder="800"><b>€</b></span>
        </label>
        <p class="err" id="budgetErr" hidden></p>
        <div class="budget-actions">
          <button type="button" class="remove" id="budgetCancel">Annuler</button>
          <button class="submit" id="budgetSave">Enregistrer</button>
        </div>
        <button type="button" class="link" id="budgetClear" hidden>Retirer le budget</button>
      </form>
    </section>

    <p class="note" id="status" hidden></p>

    <section class="cats" id="cats" aria-label="Par catégorie"></section>

    <section>
      <h2>Dépenses</h2>
      <div class="days" id="days"></div>
    </section>

    <section>
      <h2>6 derniers mois</h2>
      <div class="history" id="history"></div>
    </section>

    <div class="foot"><button class="link" id="logout">Se déconnecter</button></div>
  </div>

  <button class="fab" id="open"><span>+</span> Dépense</button>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <form id="form" novalidate>
    <div class="sheet-head">
      <button type="button" id="cancel">Annuler</button>
      <h2 id="sheetTitle">Nouvelle dépense</h2>
      <span></span>
    </div>
    <label class="amount-field">
      <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Montant">
      <span>€</span>
    </label>
    <label class="lbl"><span>Nom</span>
      <input class="field" id="note" placeholder="Ex. Carrefour (facultatif)" autocomplete="off" maxlength="80">
    </label>
    <div class="lbl"><span>Catégorie</span>
      <div class="chips" id="chips" role="group" aria-label="Catégorie"></div>
    </div>
    <label class="lbl"><span>Date</span>
      <input class="field" id="date" type="date">
    </label>
    <p class="err" id="err" hidden></p>
    <button class="submit" id="save">Ajouter</button>
    <button type="button" class="remove" id="remove" hidden>Supprimer la dépense</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Supabase project (publishable key: safe in the browser, the table is protected by row-level security)
const SUPABASE_URL = "https://tmbhloqtvtzyopciqpkz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtYmhsb3F0dnR6eW9wY2lxcGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDkyMDIsImV4cCI6MjEwOTEyNTIwMn0.XDcWq1zflaHVk2BxAZ9gKzdaIcyf91JxXpaV2KT772E";

const CATS = [
  ["courses", "Courses", "#3a9b6a"],
  ["resto", "Resto & café", "#e08a2e"],
  ["transport", "Transport", "#3b7fd9"],
  ["logement", "Logement", "#8a5cd6"],
  ["loisirs", "Loisirs", "#d6508a"],
  ["sante", "Santé", "#2fa8b0"],
  ["shopping", "Shopping", "#c9a227"],
  ["autre", "Autre", "#8a90a6"],
];
const catOf = id => CATS.find(c => c[0] === id) || CATS[CATS.length - 1];
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const money = cents => eur.format(cents / 100);
const $ = id => document.getElementById(id);

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const thisMonth = () => ymd(new Date()).slice(0, 7);
const shiftMonth = (m, k) => { const [y, mo] = m.split("-").map(Number); return ymd(new Date(y, mo - 1 + k, 1)).slice(0, 7); };
const monthLabel = (m, opts = { month: "long", year: "numeric" }) => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("fr-FR", opts); };

// "12,5" / "12.50" / "1 200" -> cents, or null
function parseCents(s) {
  const t = String(s).replace(/\s/g, "").replace(",", ".");
  if (!/^\d+(\.\d{0,2})?$/.test(t)) return null;
  const c = Math.round(parseFloat(t) * 100);
  return c > 0 ? c : null;
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});
// Our own copy of the refresh token: Supabase wipes its stored session when a refresh fails
// (e.g. app reopened with no network yet); with this copy we reconnect instead of asking for the password.
const KEEP = "cashtrack-refresh";
const keep = {
  get: () => { try { return localStorage.getItem(KEEP); } catch { return null; } },
  set: t => { try { localStorage.setItem(KEEP, t); } catch {} },
  clear: () => { try { localStorage.removeItem(KEEP); } catch {} },
};

let rows = [];         // expenses of the 6-month window ending at `month`
let month = thisMonth();
let editing = null;    // expense open in the sheet, null when adding
let user = null;       // signed-in user; the monthly budget lives in user.user_metadata.budget_cents
const budget = () => user?.user_metadata?.budget_cents || 0;
let cat = "courses";
let loadSeq = 0;

async function load() {
  const seq = ++loadSeq;
  const from = shiftMonth(month, -5) + "-01", to = shiftMonth(month, 1) + "-01";
  const { data, error } = await sb.from("expenses")
    .select("id, amount_cents, category, note, spent_on, created_at")
    .gte("spent_on", from).lt("spent_on", to)
    .order("spent_on", { ascending: false }).order("created_at", { ascending: false })
    .limit(5000);
  if (seq !== loadSeq) return;  // a newer month was requested meanwhile
  if (error) { $("status").textContent = "Impossible de charger tes dépenses. Vérifie ta connexion."; $("status").hidden = false; return; }
  $("status").hidden = true;
  rows = data;
  render();
}

function render() {
  $("monthName").textContent = monthLabel(month);
  $("next").disabled = month >= thisMonth();
  const inMonth = m => rows.filter(e => e.spent_on.slice(0, 7) === m);
  const sum = list => list.reduce((s, e) => s + e.amount_cents, 0);

  const items = inMonth(month);
  const prev = shiftMonth(month, -1), prevTotal = sum(inMonth(prev));
  $("total").textContent = money(sum(items));
  $("sub").textContent = `${items.length} dépense${items.length > 1 ? "s" : ""}` +
    (prevTotal ? ` · ${monthLabel(prev, { month: "long" })} : ${money(prevTotal)}` : "");

  // monthly budget
  const goal = budget(), spent = sum(items);
  const editingBudget = !$("budgetForm").hidden;
  $("budgetSet").hidden = !!goal || editingBudget;
  $("budgetBox").hidden = !goal || editingBudget;
  if (goal) {
    const ratio = spent / goal;
    const state = ratio > 1 ? "over" : ratio >= 0.8 ? "near" : "ok";
    $("budgetBox").dataset.state = state;
    $("budgetFill").style.width = Math.min(ratio, 1) * 100 + "%";
    $("budgetLeft").textContent = ratio > 1 ? `Dépassé de ${money(spent - goal)}` : `Reste ${money(goal - spent)}`;
    $("budgetOf").textContent = `${Math.round(ratio * 100)} % de ${money(goal)}`;
  }

  // by category
  const byCat = {};
  items.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount_cents);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  $("cats").innerHTML = "";
  cats.forEach(([id, v]) => {
    const [, name, color] = catOf(id);
    const r = document.createElement("div");
    r.className = "cat-row";
    r.innerHTML = `<span></span><div class="bar"><i></i></div><span class="num"></span>`;
    r.children[0].textContent = name;
    r.querySelector("i").style.cssText = `width:${(v / cats[0][1]) * 100}%;background:${color}`;
    r.children[2].textContent = money(v);
    $("cats").append(r);
  });

  // list grouped by day
  const days = $("days");
  days.innerHTML = "";
  if (!items.length) days.innerHTML = `<p class="empty">Aucune dépense en ${monthLabel(month, { month: "long" })}. Appuie sur « + Dépense » pour ajouter la première.</p>`;
  let group = null, lastDate = null;
  items.forEach(e => {
    if (e.spent_on !== lastDate) {
      lastDate = e.spent_on;
      group = document.createElement("div");
      group.className = "day";
      const [y, m, d] = e.spent_on.split("-").map(Number);
      group.innerHTML = `<div class="day-head"><span></span><span class="num"></span></div>`;
      group.querySelector("span").textContent = new Date(y, m - 1, d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      group.querySelector(".num").textContent = money(sum(items.filter(x => x.spent_on === e.spent_on)));
      days.append(group);
    }
    const [, name, color] = catOf(e.category);
    const b = document.createElement("button");
    b.className = "item";
    b.setAttribute("aria-label", `Modifier ${e.note || name}, ${money(e.amount_cents)}`);
    b.innerHTML = `<i class="dot"></i><span class="what"><b></b><small></small></span><span class="amt num"></span>`;
    b.querySelector(".dot").style.background = color;
    b.querySelector("b").textContent = e.note || name;
    b.querySelector("small").textContent = e.note ? name : "";
    b.querySelector(".amt").textContent = money(e.amount_cents);
    b.onclick = () => openSheet(e);
    group.append(b);
  });

  // last 6 months ending at the viewed month
  const hist = $("history");
  hist.innerHTML = "";
  const months = [...Array(6)].map((_, i) => shiftMonth(month, i - 5));
  const sums = months.map(m => sum(inMonth(m)));
  const hmax = Math.max(...sums, 1);
  months.forEach((m, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-current", m === month);
    b.setAttribute("aria-label", `${monthLabel(m)} : ${money(sums[i])}`);
    b.innerHTML = `<span class="col"></span><span class="num"></span><span></span>`;
    b.querySelector(".col").style.height = `${(sums[i] / hmax) * 100}%`;
    if (budget() && sums[i] > budget()) b.classList.add("over");
    b.children[1].textContent = sums[i] ? Math.round(sums[i] / 100) + " €" : "–";
    b.children[2].textContent = monthLabel(m, { month: "short" });
    b.onclick = () => { month = m; render(); };  // already inside the loaded window
    hist.append(b);
  });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
}

// category chips
CATS.forEach(([id, name, color]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.id = id;
  b.innerHTML = `<i></i>`; b.querySelector("i").style.background = color;
  b.append(name);
  b.onclick = () => { cat = id; syncChips(); };
  $("chips").append(b);
});
const syncChips = () => $("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === cat));

// e = an expense to edit, or nothing to add a new one
function openSheet(e) {
  editing = e || null;
  $("sheetTitle").textContent = e ? "Modifier la dépense" : "Nouvelle dépense";
  $("save").textContent = e ? "Enregistrer" : "Ajouter";
  $("amount").value = e ? (e.amount_cents / 100).toFixed(2).replace(".", ",") : "";
  $("note").value = e ? e.note : "";
  $("date").value = e ? e.spent_on : ymd(new Date());
  if (e) cat = e.category;
  $("remove").hidden = !e;
  $("remove").classList.remove("armed");
  $("remove").textContent = "Supprimer la dépense";
  $("err").hidden = true;
  syncChips();
  $("sheet").hidden = false; $("sheet").scrollTop = 0;
  $("open").hidden = true;
  document.body.classList.add("locked");
  if (!e) $("amount").focus();
}
function closeSheet() {
  $("sheet").hidden = true; $("open").hidden = false;
  document.body.classList.remove("locked");
  editing = null;
}

$("open").onclick = () => openSheet();
$("cancel").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// monthly budget, stored on the account (user metadata) so it follows every device
function openBudget() {
  $("budgetInput").value = budget() ? String(budget() / 100).replace(".", ",") : "";
  $("budgetErr").hidden = true;
  $("budgetClear").hidden = !budget();
  $("budgetForm").hidden = false; $("budgetSet").hidden = $("budgetBox").hidden = true;
  $("budgetInput").focus();
}
const closeBudget = () => { $("budgetForm").hidden = true; render(); };
async function saveBudget(cents) {
  $("budgetSave").disabled = true;
  const { data, error } = await sb.auth.updateUser({ data: { budget_cents: cents } });
  $("budgetSave").disabled = false;
  if (error) { $("budgetErr").textContent = "Enregistrement impossible. Vérifie ta connexion et réessaie."; $("budgetErr").hidden = false; return; }
  user = data.user;
  closeBudget();
  toast(cents ? `Budget : ${money(cents)} par mois` : "Budget retiré");
}
$("budgetSet").onclick = openBudget;
$("budgetBox").onclick = openBudget;
$("budgetCancel").onclick = closeBudget;
$("budgetClear").onclick = () => saveBudget(0);
$("budgetForm").addEventListener("submit", e => {
  e.preventDefault();
  const cents = parseCents($("budgetInput").value);
  if (!cents) { $("budgetErr").textContent = "Entre un montant, par exemple 800."; $("budgetErr").hidden = false; return; }
  saveBudget(cents);
});

// two taps to delete: the first arms the button, the second deletes
$("remove").onclick = async () => {
  const btn = $("remove");
  if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Confirmer la suppression"; return; }
  const id = editing.id;
  btn.disabled = true;
  const { error } = await sb.from("expenses").delete().eq("id", id);
  btn.disabled = false;
  if (error) { $("err").textContent = "Suppression impossible. Vérifie ta connexion et réessaie."; $("err").hidden = false; return; }
  rows = rows.filter(x => x.id !== id);
  closeSheet(); render(); toast("Dépense supprimée");
};
$("prev").onclick = () => { month = shiftMonth(month, -1); render(); load(); };
$("next").onclick = () => { month = shiftMonth(month, 1); render(); load(); };

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const amount = parseCents($("amount").value);
  const date = $("date").value;
  const fail = msg => { $("err").textContent = msg; $("err").hidden = false; };
  if (!amount) { fail("Entre un montant, par exemple 12,50."); $("amount").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { fail("Choisis une date."); return; }
  $("save").disabled = true;
  const fields = { amount_cents: amount, category: cat, note: $("note").value.trim(), spent_on: date };
  const wasEdit = !!editing;
  const { error } = wasEdit
    ? await sb.from("expenses").update(fields).eq("id", editing.id)
    : await sb.from("expenses").insert(fields);
  $("save").disabled = false;
  if (error) { fail("Enregistrement impossible. Vérifie ta connexion et réessaie."); return; }
  closeSheet();
  month = date.slice(0, 7);
  toast(wasEdit ? "Dépense modifiée" : `${money(amount)} ajouté`);
  load();
});

// auth: email + password (works inside the home-screen app, unlike magic links which open Safari)
let signup = false;
$("toggleMode").onclick = () => {
  signup = !signup;
  $("loginBtn").textContent = signup ? "Créer mon compte" : "Se connecter";
  $("toggleMode").textContent = signup ? "J'ai déjà un compte" : "Première fois ? Créer mon compte";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("loginErr").hidden = $("loginOk").hidden = true;
};
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), password = $("password").value;
  $("loginErr").hidden = $("loginOk").hidden = true;
  if (!email || password.length < 6) { $("loginErr").textContent = "Entre ton e-mail et un mot de passe d'au moins 6 caractères."; $("loginErr").hidden = false; return; }
  $("loginBtn").disabled = true;
  const { data, error } = signup
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  $("loginBtn").disabled = false;
  if (error) {
    $("loginErr").textContent = error.message.includes("Invalid login") ? "E-mail ou mot de passe incorrect."
      : error.message.includes("not confirmed") ? "Confirme d'abord ton e-mail avec le lien reçu, puis reviens te connecter."
      : "Erreur : " + error.message;
    $("loginErr").hidden = false; return;
  }
  if (signup && !data.session) {
    $("loginOk").textContent = "Compte créé. Ouvre le lien reçu par e-mail pour le confirmer, puis reviens ici et connecte-toi.";
    $("loginOk").hidden = false;
    $("toggleMode").click(); $("loginOk").hidden = false;
  }
});
$("logout").onclick = () => { keep.clear(); sb.auth.signOut(); };

const showApp = on => { $("login").hidden = on; $("app").hidden = !on; };
// open straight on the app when we hold a token, instead of flashing the login screen
if (keep.get()) showApp(true);
try { $("email").value = localStorage.getItem("cashtrack-email") || ""; } catch {}

let recovering = false;
async function recover() {
  const token = keep.get();
  if (!token || recovering) return false;
  recovering = true;
  for (let i = 0; i < 3; i++) {   // retry: right after launch iOS may not have network yet
    const { data, error } = await sb.auth.refreshSession({ refresh_token: token });
    if (data?.session) { recovering = false; return true; }
    if (error && /invalid|not found|revoked|already used/i.test(error.message)) break;  // token really dead
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  recovering = false;
  if (keep.get() === token) { keep.clear(); showApp(false); }
  return false;
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    keep.set(session.refresh_token);
    try { localStorage.setItem("cashtrack-email", session.user.email || ""); } catch {}
    user = session.user;
    showApp(true);
    // setTimeout: calling Supabase from inside this callback can deadlock its auth lock
    if (event !== "TOKEN_REFRESHED") { render(); setTimeout(load, 0); }
    return;
  }
  if (event === "SIGNED_OUT" && !keep.get()) { rows = []; user = null; showApp(false); return; }
  // no session but we still hold a token: reconnect silently
  if (keep.get()) { setTimeout(recover, 0); return; }
  showApp(false);
});

// coming back to the app after a while: make sure the token is fresh
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") sb.auth.getSession().then(({ data }) => { if (!data.session) recover(); else load(); });
});
</script>
